name: Build docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing is opt-in. The deploy job is skipped unless the repo variable PUBLISH_TARGET is
# set to "github-pages", so the site can be built and inspected before it has a URL at all.
# Setting that variable is the moment the site becomes readable by anyone - do it deliberately.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: easycrm-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --omit=dev: the only devDependencies are the screenshot harness (playwright, sharp),
      # which the site build never touches. Skipping them keeps CI off native binaries it
      # has no use for.
      - run: npm ci --omit=dev


      - name: Build
        env:
          # The ORIGIN. Set this to the custom domain once there is one.
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          # The PATH under that origin, and the one people forget. A GitHub Pages project site
          # is served from /<repo>/; a custom domain is served from /. Getting this wrong makes
          # every asset resolve one directory too high and the site 404s with no error anywhere.
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
        run: npx docusaurus build

      - name: Upload Pages artifact
        if: vars.PUBLISH_TARGET == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: vars.PUBLISH_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
