openapi: 3.0.3

info:
  title: EasyCRM Portal API
  version: "1.0"
  description: |
    A read-only REST API over the data a portal user can already see.

    The API answers every request through the same code that renders the portal's own list
    views, so object permissions, field-level access and record sharing are applied by the
    portal's rules rather than a second copy of them. It follows that **the API can never
    return anything the key's portal user could not open by logging in**, and that it can
    only ever read: there is no create, update or delete.

    ## What you need

    Three things, all from a portal administrator:

    | | |
    |---|---|
    | **Endpoint** | the address below, specific to your org. The admin has a *Copy endpoint* button next to the key. |
    | **Client ID** | identifies the key. Safe to share. |
    | **Secret** | shown once, when the key is created. Treat it like a password. |

    If the Secret is lost it cannot be looked up. An administrator presses *Regenerate*,
    which issues a new one and immediately stops the old one working.

    ## What a key can reach

    An administrator decides, per key:

    - which **objects** it may read
    - which **fields** of each come back
    - a **filter** limiting which rows it sees at all
    - the **order** rows arrive in
    - whether the caller may add filters or choose their own sort

    Anything not granted simply does not exist as far as the key is concerned, and a caller
    cannot widen the grant: a filter they send is applied *on top of* the administrator's.

servers:
  - url: https://{host}/{sitePath}/services/apexrest/EasyCRM/api/v1
    description: Your portal's Site. Use the endpoint your administrator sent you rather than assembling this by hand.
    variables:
      host:
        default: your-portal.my.salesforce-sites.com
        description: The Salesforce Site domain for your org.
      sitePath:
        default: portalcrm
        description: The Site's path prefix, set when the portal was created.

security:
  - ClientId: []
    Secret: []

tags:
  - name: Query
    description: Reading records.

paths:
  /query:
    get:
      tags: [Query]
      summary: Read records
      operationId: queryRecords
      description: |
        Returns a page of records for one object.

        Only the fields the administrator selected for this key are returned, and only rows
        that pass both their filter and the portal's own sharing rules.

        ### Reading the response

        `records` holds the rows. Each row always carries `Id`, plus one key per selected
        field. A **lookup** field arrives as three keys: the display value, the same name
        with `_id` for the record it points at, and `_obj` for that record's object. So a
        selected `RecordTypeId` returns `RecordTypeId`, `RecordTypeId_id` and
        `RecordTypeId_obj`.

        ### Moving between pages

        You do not get everything at once. The response carries `nextUrl` and `prevUrl` —
        complete addresses, with your own parameters already carried over. Open `nextUrl`
        to go forward and `prevUrl` to go back; an empty value means there is nothing in
        that direction. On the first page `prevUrl` is always empty.

        Following those links is the intended way to page. Building the address yourself
        means handling the cursor, which is deliberately opaque and may change form.
      parameters:
        - name: object
          in: query
          required: true
          description: |
            API name of the object to read, for example `Account` or `Contact`. Must be one
            the administrator granted to this key, otherwise the request is refused.
          schema:
            type: string
            example: Account
        - name: limit
          in: query
          required: false
          description: |
            How many records to return. Maximum **200**. If you need more data, follow
            `nextUrl` for further pages rather than asking for a larger one.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
            example: 25
        - name: cursor
          in: query
          required: false
          description: |
            Marks the place to continue from. Opaque — send back exactly what you were
            given and do not try to read or construct one. You will normally never set this
            by hand, because `nextUrl` and `prevUrl` already contain it.
          schema:
            type: string
        - name: externalId
          in: query
          required: false
          description: |
            Fetch the single record whose **Portal External Id** matches this value, instead
            of a page of records. Every record carries its own, shown on the record in the
            portal.

            Refused with `400` on an object where the field has not been set up.
          schema:
            type: string
            example: EXT-000001
        - name: filters
          in: query
          required: false
          description: |
            Extra filters, as a JSON array. **Only honoured when the administrator ticked
            "Allow the caller to add their own filters"** — otherwise it is ignored, not
            refused.

            These narrow the result. They are combined with the administrator's own filter,
            which always applies, so this can never return rows they excluded.

            Each entry is `{"field": ..., "operator": ..., "value": ...}`. Operators:
            `eq`, `ne`, `contains`, `ncontains`, `starts`, `lt`, `le`, `gt`, `ge` —
            meaning equals, not equal to, contains, does not contain, starts with,
            is before, is on or before, is after, is on or after.
          schema:
            type: string
          example: '[{"field":"Type","operator":"eq","value":"Customer"}]'
        - name: sortField
          in: query
          required: false
          description: |
            Field to order by. **Only honoured when the administrator ticked "Allow the
            caller to choose their own sort"** — otherwise the saved order is used.

            Must be one of the fields granted to this key. Address and long text fields
            cannot be sorted on at all and are refused with `400`.
          schema:
            type: string
            example: Name
        - name: sortDir
          in: query
          required: false
          description: Direction for `sortField`.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: A page of records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              example:
                object: Account
                records:
                  - Id: 001Bi00000UMyF1IAL
                    Name: Acme Corporation
                    Type: Customer
                    RecordTypeId: Enterprise
                    RecordTypeId_id: 012Bi0000016H8rIAE
                    RecordTypeId_obj: RecordType
                  - Id: 001Bi00000UN3jLIAT
                    Name: Globex
                    Type: Prospect
                    RecordTypeId: Small Business
                    RecordTypeId_id: 012Bi0000016H8sIAE
                    RecordTypeId_obj: RecordType
                count: 2
                hasMore: true
                nextCursor: eyJ2IjoiR2xvYmV4IiwiaWQiOiIwMDFCaTAwMDAwVU4zakxJQVQifQ
                nextUrl: https://your-portal.my.salesforce-sites.com/portalcrm/services/apexrest/EasyCRM/api/v1/query?object=Account&limit=2&cursor=eyJ2IjoiR2xvYmV4IiwiaWQiOiIwMDFCaTAwMDAwVU4zakxJQVQifQ
                prevCursor: ""
                prevUrl: ""
        "400":
          description: |
            The request could not be completed. The `error` field says what to change —
            for example an object that was not named, an External Id field that is not set
            up on that object, or a sort field that is not granted or cannot be sorted on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notSortable:
                  summary: A field the platform cannot order by
                  value:
                    error: Records cannot be sorted by BillingAddress. Address and long text fields are not sortable - choose another field.
                notGranted:
                  summary: Sorting by a field this key was not given
                  value:
                    error: You cannot sort by Industry - it is not one of the fields available to this key.
                badDirection:
                  value:
                    error: sortDir must be asc or desc.
                noObject:
                  value:
                    error: No object requested.
        "401":
          description: |
            Not authorised. The Client ID is unknown, the Secret does not match, or the key
            has been revoked — the response is deliberately the same for all three, so the
            endpoint cannot be used to work out which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Not authorised.
        "403":
          description: |
            The object is not available to this key — either the administrator never granted
            it, or the key's portal user has since lost permission to read it. Both give the
            same answer on purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: That object is not available to this key.
        "429":
          description: |
            Too many requests this hour. The ceiling is set per key and defaults to 500.
            Wait, then continue — a `Retry-After` header is returned alongside.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
                example: 3600
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Too many requests. The limit is 500 per hour.

components:
  securitySchemes:
    ClientId:
      type: apiKey
      in: header
      name: x-easycrm-client-id
      description: The Client ID your administrator gave you. Identifies the key.
    Secret:
      type: apiKey
      in: header
      name: x-easycrm-secret
      description: The Secret your administrator gave you. Treat it like a password.

  schemas:
    QueryResponse:
      type: object
      properties:
        object:
          type: string
          description: The object these records came from.
          example: Account
        records:
          type: array
          description: |
            The rows. Each always carries `Id`, plus one key per field the administrator
            selected. A lookup field also returns `<field>_id` and `<field>_obj`.
          items:
            type: object
            additionalProperties: true
        count:
          type: integer
          description: How many records are in **this page**. Not the total available.
          example: 25
        hasMore:
          type: boolean
          description: Whether a further page exists after this one.
        nextCursor:
          type: string
          description: Opaque marker for the next page. Empty on the last page. Prefer `nextUrl`.
        nextUrl:
          type: string
          description: |
            The complete address of the next page, with your own parameters carried over.
            Empty when there are no more pages.
        prevCursor:
          type: string
          description: Opaque marker for the previous page. Empty on the first page. Prefer `prevUrl`.
        prevUrl:
          type: string
          description: |
            The complete address of the previous page. Empty on the first page, which is how
            you know you have reached the start.

    Error:
      type: object
      properties:
        error:
          type: string
          description: What went wrong, in a form safe to show a user.
      example:
        error: Not authorised.
